<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars 4 You Form</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script defer type="module" src="/static/js/car-form.js"></script>
</head>
<body>
    <div class="container">
        <h1>Car Details Form</h1>
        <p class="subtitle">Enter the vehicle information below</p>

        <form id="carForm" method="POST" action="/submit">
            <div class="form-grid">
                <!-- Brand -->
                <div class="form-group">
                    <label for="brand">Brand <span class="required">*</span></label>
                    <select id="brand" name="brand" required>
                        <option value="">Select Brand</option>
                        {% for brand in brands %}
                        <option value="{{ brand }}">{{ brand|title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Model -->
                <div class="form-group">
                    <label for="model">Model <span class="required">*</span></label>
                    <select id="model" name="model" required disabled>
                        <option value="">Select Model</option>
                    </select>
                </div>

                <!-- Year -->
                <div class="form-group">
                    <label for="year">Year <span class="required">*</span></label>
                    <input type="number" id="year" name="year" min="1900" max="2024" required placeholder="e.g., 2020">
                </div>

                <!-- Mileage -->
                <div class="form-group">
                    <label for="mileage">Mileage (miles) <span class="required">*</span></label>
                    <input type="number" id="mileage" name="mileage" min="0" required placeholder="e.g., 25000">
                </div>

                <!-- Transmission -->
                <div class="form-group">
                    <label for="transmission">Transmission <span class="required">*</span></label>
                    <select id="transmission" name="transmission" required>
                        <option value="">Select Transmission</option>
                        {% for transmission in transmissions %}
                        <option value="{{ transmission }}">{{ transmission }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Fuel Type -->
                <div class="form-group">
                    <label for="fuel_type">Fuel Type <span class="required">*</span></label>
                    <select id="fuel_type" name="fuel_type" required>
                        <option value="">Select Fuel Type</option>
                        {% for fuel_type in fuel_types %}
                        <option value="{{ fuel_type }}">{{ fuel_type }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Tax -->
                <div class="form-group">
                    <label for="tax">Tax (£) <span class="required">*</span></label>
                    <input type="number" id="tax" name="tax" min="0" required placeholder="e.g., 150">
                </div>

                <!-- MPG -->
                <div class="form-group">
                    <label for="mpg">MPG <span class="required">*</span></label>
                    <input type="number" id="mpg" name="mpg" min="0" step="0.1" required placeholder="e.g., 45.5">
                </div>

                <!-- Engine Size -->
                <div class="form-group">
                    <label for="engine_size">Engine Size (L) <span class="required">*</span></label>
                    <input type="number" id="engine_size" name="engine_size" min="0" step="0.1" required placeholder="e.g., 2.0">
                </div>

                <!-- Previous Owners -->
                <div class="form-group">
                    <label for="previous_owners">Previous Owners <span class="required">*</span></label>
                    <input type="number" id="previous_owners" name="previous_owners" min="0" required placeholder="e.g., 2">
                </div>

                <!-- Has Damage -->
                <div class="form-group full-width">
                    <div class="checkbox-group">
                        <input type="checkbox" id="has_damage" name="has_damage" value="true">
                        <label for="has_damage">Has Damage</label>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span class="button-text">Submit</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </form>

        <!-- Result Display -->
        <div id="resultContainer" class="result-container" style="display: none;">
            <h2 class="result-title">Expected Price</h2>
            <p id="resultPrice" class="result-price"></p>
        </div>
    </div>

</body>
</html>
