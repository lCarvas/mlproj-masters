[project]
name = "mlproj-masters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.6",
    "optuna>=4.6.0",
    "optuna-integration[sklearn]>=4.6.0",
    "pandas>=2.3.3",
    "polars>=1.33.1",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "fastapi[all] (>=0.115.6)",
    "gunicorn (>=23.0.0)",
    "poethepoet (>=0.32.1)",
]

[dependency-groups]
dev = [
    "kaggle>=1.7.4.5",
    "ruff>=0.13.2",
]

[tool.ruff]
line-length = 80

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY",
    "FIX",
    "COM812",
    "D100",
    "D104",
    "E501",
    'ERA001',
    "S101",
    "TD003",
    "TRY003",
    "T201"
]
unfixable = ["F401"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 80

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.poe.executor]  # https://github.com/nat-n/poethepoet
type = "simple"

[tool.poe.tasks]

  [tool.poe.tasks.serve]
  help = "Serve the REST API"
  shell = """
    cd src/
    uvicorn \
      --host $host \
      --port $port \
      --reload \
      mlproj_web.api:app
    """

    [[tool.poe.tasks.serve.args]]
    help = "Bind socket to this host (default: 0.0.0.0)"
    name = "host"
    options = ["--host"]
    default = "127.0.0.1"

    [[tool.poe.tasks.serve.args]]
    help = "Bind socket to this port (default: 8000)"
    name = "port"
    options = ["--port"]
    default = "8000"

    [[tool.poe.tasks.serve.args]]
    help = "Enable development mode"
    type = "boolean"
    name = "dev"
    options = ["--dev"]
